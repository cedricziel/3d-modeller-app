name: 3DModellerApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  SwiftUIAssistant:
    path: Packages/SwiftUIAssistant
  SwiftUIAssistantTools:
    path: Packages/SwiftUIAssistantTools

targets:
  3DModellerApp:
    type: application
    platform: macOS
    sources:
      - path: 3DModellerApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WPW3QSLZ2F
        PRODUCT_BUNDLE_IDENTIFIER: com.example.3dmodeller
        PRODUCT_NAME: 3D Modeller
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_CFBundleDisplayName: 3D Modeller
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: 3DModellerApp/3DModellerApp.entitlements
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: SwiftUIAssistant
        product: SwiftUIAssistant
      - package: SwiftUIAssistantTools
        product: SwiftUIAssistantTools
    info:
      path: 3DModellerApp/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D Scene
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.example.3dmodeller.scene
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.3dmodeller.scene
            UTTypeDescription: 3D Modeller Scene
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - scene3d

  3DModellerAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: 3DModellerAppTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/3D Modeller.app/Contents/MacOS/3D Modeller"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WPW3QSLZ2F
    dependencies:
      - target: 3DModellerApp

schemes:
  3DModellerApp:
    build:
      targets:
        3DModellerApp: all
        3DModellerAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - 3DModellerAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
