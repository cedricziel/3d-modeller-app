name: 3DModellerApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  SwiftUIAssistant:
    path: Packages/SwiftUIAssistant

targets:
  3DModellerApp:
    type: application
    platform: macOS
    sources:
      - path: 3DModellerApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.3dmodeller
        PRODUCT_NAME: 3D Modeller
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_CFBundleDisplayName: 3D Modeller
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: 3DModellerApp/3DModellerApp.entitlements
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: SwiftUIAssistant
    info:
      path: 3DModellerApp/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D Scene
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.example.3dmodeller.scene
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.3dmodeller.scene
            UTTypeDescription: 3D Modeller Scene
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - scene3d

schemes:
  3DModellerApp:
    build:
      targets:
        3DModellerApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
